name: Deploy MachineSignal Worker

on:
  push:
    branches:
      - main
    paths:
      - "api_endpoint_minimal/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MACHINESIGNAL_API_KEY: ${{ secrets.MACHINESIGNAL_ADMIN_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare API token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub repository secret CLOUDFLARE_API_TOKEN. Create a Cloudflare API token with Workers edit/deploy permission, then add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check MachineSignal admin API key
        run: |
          if [ -z "$MACHINESIGNAL_API_KEY" ]; then
            echo "::error::Missing GitHub repository secret MACHINESIGNAL_ADMIN_API_KEY. This secret is synced to the Cloudflare Worker runtime as MACHINESIGNAL_API_KEY."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: api_endpoint_minimal
          command: deploy --config wrangler.toml
          secrets: |
            MACHINESIGNAL_API_KEY
        env:
          MACHINESIGNAL_API_KEY: ${{ secrets.MACHINESIGNAL_ADMIN_API_KEY }}
